# ==============================================================================
#   MRwaitroom - configuration
# ==============================================================================
#   Waiting room behind a proxy (Velocity): while the main server restarts, is stopped or in maintenance, players
#   wait here and go back by themselves as soon as it is ready again.
#   Guide: https://mrtechnology.marcelr.at/wiki/mrwaitroom/
#   Texts are in lang/de.yml and lang/en.yml.
# ==============================================================================

# Do not change - tells the plugin which settings need to be carried over on updates.
config-version: 5


# ------------------------------------------------------------------------------
#   1) GENERAL
# ------------------------------------------------------------------------------
general:
  # "auto" = every player gets the language of their Minecraft client (German -> de, English -> en,
  # otherwise fallback-language). Or a fixed language for everyone: "de", "en".
  language: auto
  # Language for players whose game language has no file of its own.
  fallback-language: en
  # Language of texts without a single player (e.g. the console stays English anyway).
  server-language: en
  # Time zone for times like "maintenance until 18:00", e.g. "Europe/Vienna". "" = time zone of this machine.
  timezone: ""


# ------------------------------------------------------------------------------
#   2) MAIN SERVER
# ------------------------------------------------------------------------------
main:
  # Name of the main server in the proxy (section [servers] of velocity.toml) - players go back there.
  server: "main"
  # Address of the main server in the internal network (host:port of Minecraft) - shows whether it is up.
  address: "127.0.0.1:25565"
  # MRadmin on the main server (section waiting-room.link there): address of the endpoint and the shared key.
  # It tells the waiting room about restarts, maintenance and warnings. The last answer is kept while the main
  # server is down. Empty link-url = without MRadmin (the waiting room then only sees whether the server is up).
  link-url: "http://127.0.0.1:8126"
  link-key: ""
  # How often to ask (seconds).
  poll-seconds: 2


# ------------------------------------------------------------------------------
#   3) GOING BACK
# ------------------------------------------------------------------------------
return:
  # Countdown in the waiting room once the main server is ready (seconds) - shown in the bossbar, then players go back.
  delay-seconds: 10
  # Players per batch and pause between two batches (seconds).
  batch-size: 5
  batch-seconds: 2
  # Whoever could not get back this many times is disconnected (e.g. banned or not on the whitelist there).
  max-attempts: 3
  # Countdown of a restart in the bossbar (seconds). The main server may well be back earlier - then players go back
  # right away (after the countdown above).
  estimate-seconds: 120


# ------------------------------------------------------------------------------
#   4) THE ROOM
# ------------------------------------------------------------------------------
room:
  # World of the waiting room. Created empty (void) if it does not exist yet.
  world: "waitroom"
  # Build a small platform at the spawn of a newly created world.
  platform: true
  platform-block: SMOOTH_STONE
  # Chat between waiting players. Players with mrwaitroom.chat may always write.
  chat: false
  # Hide the other waiting players from each other.
  hide-players: false


# ------------------------------------------------------------------------------
#   5) DISPLAY
# ------------------------------------------------------------------------------
display:
  # Item in the hand that names the state ("Restart", "Maintenance until 18:00"); a right click opens a menu with
  # all details. The countdown runs in the bossbar - the name only changes with the state (every change plays an
  # animation in the game).
  item: CLOCK
  # Slot in the hotbar (0-8); it stays selected.
  slot: 4
  # Bossbar with the reason and the progress.
  bossbar: true
  # Colour of the bossbar: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  bossbar-color: BLUE


# ------------------------------------------------------------------------------
#   6) SERVER (STARTER AND RESTARTS)
# ------------------------------------------------------------------------------
# Only with MRadmin's starter (mrserver), which starts this server, brings it back after restarts and crashes and
# keeps Paper up to date. Set it up with "mrserver setup --role waitroom". Without the starter these do nothing.
server:
  # Memory of the server (e.g. 1G, 2048M) - takes effect on the next start. 2G are plenty for the waiting room.
  memory-min: "1G"
  memory-max: "2G"
  # Extra Java options - by default Aikar's flags. Only tuning options, anything else is ignored. "" = none.
  java-flags: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true"
  # Paper updates on every start: "auto" = newest stable build of this Minecraft version, "notify", "off".
  paper-update: "auto"
  # Planned restarts every day at these times (HH:MM in quotes, time zone general.timezone), e.g. ["05:30"].
  # The waiting room only restarts when it is not needed: the main server is ready, no maintenance runs, no restart
  # of the main server comes within 15 minutes and nobody waits - otherwise the restart waits until then.
  restart-times: []
  # What /stop in the console does: "stop" = the server stays down, "restart" = it comes back.
  plain-stop: "stop"
  # The server counts as hanging if it has not ticked for this many seconds: the starter ends and starts it. 0 = off.
  hang-seconds: 180


# ------------------------------------------------------------------------------
#   7) XAERO'S MINIMAP / WORLD MAP
# ------------------------------------------------------------------------------
xaero:
  # The proxy shows the main server and the waiting room under the same address. With its own map ID the waiting
  # room does not draw over the maps of the main server.
  enabled: true
  # Map ID of the waiting room. 0 = created on the first start.
  world-id: 0


# ------------------------------------------------------------------------------
#   8) UPDATES
# ------------------------------------------------------------------------------
updates:
  # Look for new versions on startup and regularly afterwards.
  # If a newer version is available, a notice appears in the console.
  enabled: true
  # Source: "github" (GitHub Releases, default) or "modrinth"
  source: github
  # Also report beta versions (BET-...); while a 0.x beta runs they are always reported.
  beta: false
  # How often to check again (in hours).
  interval-hours: 6
  # Notify players with "mrwaitroom.admin.update" when they join the server.
  notify-on-join: true
  # Updates ordered in MRadmin (page Plugins on the main server) are downloaded by the waiting room itself. Restart to
  # put them in as soon as nobody waits and the main server is ready. Needs something that starts the server again
  # (e.g. systemd with Restart=always) - otherwise the update waits for your next restart.
  restart-when-idle: true
