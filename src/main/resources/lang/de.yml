# ==============================================================================
#   MRwaitroom - Sprachdatei: Deutsch (de)
# ==============================================================================
#   Aktivieren: in der config.yml  general.language: de  (oder auto)
#   Eigene Sprache: diese Datei kopieren (z.B. als fr.yml), übersetzen und language: fr setzen.
#   Fehlende Texte werden bei Updates automatisch ergänzt - deine Änderungen bleiben erhalten.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Leerer Text ("") = die Nachricht wird nicht gesendet.
#   Platzhalter der Anzeige: <server> <reason> <since> <time> <estimate> <title> <end>
# ==============================================================================

# Nicht ändern - sagt dem Plugin, welche Texte bei Updates erneuert werden müssen.
lang-version: 7

prefix: "<dark_gray>[<aqua>Warteraum</aqua>]</dark_gray> "

# Reine Texte (ohne Formatierung) - werden in andere Texte eingesetzt.
reason-none: "kein Grund angegeben"
server-name: "der Server"
maintenance-no-title: "Wartungsarbeiten"

# ------------------------------------------------------------- Item in der Hotbar
# Name der Uhr - ändert sich nur, wenn sich die Lage ändert (jede Änderung spielt im Spiel eine Animation ab).
item-restart: "<yellow>⏳ Neustart"
item-restart-late: "<yellow>⏳ Neustart"
item-stop: "<red>■ Server ist aus"
item-crash: "<gold>↻ Server startet neu"
item-crash-late: "<gold>↻ Server startet neu"
item-starting: "<green>↻ Server startet"
item-ready: "<green>➜ Zurück zum Server"
item-returning: "<green>➜ Zurück zum Server"
item-maintenance: "<aqua>🛠 Wartung bis <white><end>"
item-maintenance-open: "<aqua>🛠 Wartung"
item-lore:
  - "<gray>Du wartest im Warteraum und kommst"
  - "<gray>automatisch zurück."
  - "<yellow>Rechtsklick: <gray>alle Einzelheiten"

# ---------------------------------------------------------------------- Bossbar
# Oben am Bildschirm, jede Sekunde neu. Immer gleich aufgebaut: Zustand | Countdown (Grund und Einzelheiten im Uhr-Menü).
bossbar-restart: "<yellow>Neustart</yellow> <dark_gray>|</dark_gray> <white><time>"
bossbar-restart-late: "<yellow>Neustart</yellow> <dark_gray>|</dark_gray> <white>gleich wieder da"
bossbar-stop: "<red>Server aus</red> <dark_gray>|</dark_gray> <white>Ende offen"
bossbar-crash: "<gold>Server startet neu</gold> <dark_gray>|</dark_gray> <white><time>"
bossbar-crash-late: "<gold>Server startet neu</gold> <dark_gray>|</dark_gray> <white>gleich wieder da"
bossbar-starting: "<green>Server startet</green> <dark_gray>|</dark_gray> <white>gleich geht es los"
bossbar-ready: "<green>Server bereit</green> <dark_gray>|</dark_gray> <white><time>"
bossbar-returning: "<green>Server bereit</green> <dark_gray>|</dark_gray> <white>es geht zurück"
bossbar-maintenance: "<aqua>Wartung</aqua> <dark_gray>|</dark_gray> <white><time>"
bossbar-maintenance-open: "<aqua>Wartung</aqua> <dark_gray>|</dark_gray> <white>Ende offen"

# --------------------------------------------------------------------- Menü
# Öffnet sich mit Rechtsklick auf die Uhr.
menu-title: "Warteraum"
menu-reason-name: "<yellow>Grund"
menu-reason-lore:
  - "<white><reason>"
menu-time-name: "<aqua>Zeit"
menu-time-lore:
  - "<gray>Weg seit: <white><since>"
  - "<gray>Noch ca.: <white><time>"
  - "<gray>Countdown bei Neustarts: <white><estimate>"
menu-maintenance-name: "<aqua>Wartung"
menu-maintenance-lore:
  - "<white><title>"
  - "<gray>Beginn: <white><start>"
  - "<gray>Ende: <white><end>"
menu-maintenance-planned:
  - "<gray>Geplant: <white><title>"
  - "<gray>Beginn: <white><start>"
  - "<gray>Ende: <white><end>"
menu-maintenance-none:
  - "<gray>Keine Wartung geplant."
menu-alerts-name: "<red>Warnungen"
menu-alert-line: "<white>• <title>"
menu-alerts-none:
  - "<gray>Keine."
menu-back-name: "<green>Zurück zum Server"
menu-back-lore:
  - "<gray>Der Server ist bereit."
menu-back-locked-name: "<gray>Noch nicht bereit"
menu-back-locked-lore:
  - "<gray>Du kommst automatisch zurück,"
  - "<gray>sobald es weitergeht."
menu-close: "<red>Schließen"

# ------------------------------------------------------------- Beim Betreten
join-restart: "<prefix><yellow>Neustart – du kommst automatisch zurück. <hover:show_text:'<gray>Grund: <white><reason><newline><gray>Countdown <white><estimate></white>, oft schneller'><dark_gray>[Info]</dark_gray></hover>"
join-stop: "<prefix><red>Der Server ist heruntergefahren. <hover:show_text:'<gray>Grund: <white><reason><newline><gray>Aus seit <white><since><newline><gray>Du kommst zurück, sobald er wieder läuft.'><dark_gray>[Info]</dark_gray></hover>"
join-crash: "<prefix><gold>Der Server ist gerade nicht erreichbar. <hover:show_text:'<gray>Seit <white><since><newline><gray>Du kommst automatisch zurück, sobald er wieder läuft.'><dark_gray>[Info]</dark_gray></hover>"
join-starting: "<prefix><green>Der Server startet – gleich geht es weiter."
join-ready: "<prefix><green>Der Server ist bereit – es geht gleich zurück."
ready-countdown: "<prefix><green>Der Server ist wieder bereit – in <white><time></white> Sekunden geht es zurück."
back-item-name: "<green>Zurück zum Server"
back-item-lore:
  - "<gray>Rechtsklick: sofort zurück"
  - "<gray>(auch während einer Wartung)"
join-maintenance: "<prefix><aqua>Wartung bis <white><end></white>. <hover:show_text:'<gray><white><title></white><newline><gray>Noch ca. <white><time><newline><gray>Danach kommst du automatisch zurück.'><dark_gray>[Info]</dark_gray></hover>"
join-maintenance-open: "<prefix><aqua>Wartung – Ende noch offen. <hover:show_text:'<gray><white><title></white><newline><gray>Danach kommst du automatisch zurück.'><dark_gray>[Info]</dark_gray></hover>"
alert: "<prefix><red>⚠ <white><title>"

# ---------------------------------------------------------------- Anzeigetafel
# Die Tafel aus 4 × 2 Karten (/mrwaitroom screen set). Pro Zustand fünf Zeilen:
# Überschrift, Text, Einzelheit, Countdown (groß), Beschriftung darunter. Leere Zeile = nichts.
screen-restart: ["NEUSTART", "Der Server startet neu.", "Grund: <reason>", "<time>", "verbleibend"]
screen-restart-late: ["NEUSTART", "Gleich wieder da.", "Grund: <reason>", "...", "gleich geht es los"]
screen-stop: ["SERVER AUS", "Der Server wurde heruntergefahren.", "Grund: <reason>", "--:--", "Ende offen"]
screen-crash: ["NEUSTART", "Der Server ist gerade nicht erreichbar.", "Weg seit <since>", "<time>", "verbleibend"]
screen-crash-late: ["NEUSTART", "Der Server ist gerade nicht erreichbar.", "Weg seit <since>", "...", "gleich geht es los"]
screen-starting: ["STARTET", "Der Server fährt hoch.", "Gleich geht es zurück.", "...", "gleich geht es los"]
screen-ready: ["BEREIT", "Der Server ist wieder da.", "Du kommst automatisch zurück.", "<time>", "bis es zurückgeht"]
screen-returning: ["BEREIT", "Es geht zurück zum Server ...", "", ">>", ""]
screen-maintenance: ["WARTUNG", "<title>", "Ende: <end>", "<time>", "verbleibend"]
screen-maintenance-open: ["WARTUNG", "<title>", "Ende noch offen", "--:--", "Ende offen"]
# Fußzeile links: Wartung; rechts: Name des Servers (aus MRadmin).
screen-footer-maintenance: "Wartung seit <start>"
screen-footer-planned: "Nächste Wartung: <start>"
screen-footer-none: "Keine Wartung geplant"
screen-footer-server: "<server>"

# -------------------------------------------------------------------- Rückkehr
returning: "<prefix><green>Es geht zurück zum Server …"
main-not-ready: "<prefix><gray>Der Server ist noch nicht bereit – du kommst automatisch zurück."
kick-refused: "<red>Du kannst den Server gerade nicht betreten.<newline><newline><gray>Er hat dich mehrmals abgewiesen (z.B. Whitelist oder Sperre)."
chat-off: "<prefix><gray>Im Warteraum ist der Chat aus."

# ------------------------------------------------------------------- Befehle
usage: "<prefix><gray>Befehle: <aqua>/mrwaitroom status</aqua>, <aqua>send <spieler|all></aqua>, <aqua>screen</aqua>, <aqua>lobby</aqua>, <aqua>reload</aqua>, <aqua>version</aqua>"
screen-usage: "<prefix><gray>Anzeigetafel: <aqua>/mrwaitroom screen set</aqua> <hover:show_text:'<gray>Schau dabei auf einen Rahmen einer Wand aus 4 × 2 Rahmen.'><dark_gray>[?]</dark_gray></hover> <gray>oder <aqua>remove"
screen-set-done: "<prefix><green>Die Anzeigetafel hängt. <hover:show_text:'<gray>Die Rahmen sind gesperrt.<newline><gray>Abnehmen: <white>/mrwaitroom screen remove'><dark_gray>[Info]</dark_gray></hover>"
screen-no-frame: "<prefix><red>Schau auf einen Rahmen der Wand."
screen-not-on-wall: "<prefix><red>Die Rahmen müssen an einer Wand hängen."
screen-wrong-size: "<prefix><red>Die Wand ist <white><width> × <height></white> Rahmen groß. <hover:show_text:'<gray>Gebraucht werden genau 4 breit und 2 hoch,<newline><gray>alle Rahmen in dieselbe Richtung.'><dark_gray>[Info]</dark_gray></hover>"
screen-removed: "<prefix><green>Die Anzeigetafel ist abgenommen."
screen-none: "<prefix><gray>Es hängt keine Anzeigetafel."
lobby-usage: "<prefix><gray>Lobby speichern: <aqua>/mrwaitroom lobby save</aqua> <hover:show_text:'<gray>Ohne Angabe findet MRwaitroom den Bau selbst.<newline><gray>Bereich angeben: <white>save x1 y1 z1 x2 y2 z2'><dark_gray>[?]</dark_gray></hover>"
lobby-saving: "<prefix><gray>Lobby wird gespeichert ..."
lobby-saved: "<prefix><green>Lobby gespeichert <white>(<size>)</white>. <hover:show_text:'<gray>Von <white><from></white> bis <white><to><newline><gray>Neue Warteraum-Welten starten mit dieser Lobby,<newline><gray>Spawn und Anzeigetafel inklusive.<newline><gray>Ordner: plugins/MRwaitroom/lobby'><dark_gray>[Info]</dark_gray></hover>"
lobby-empty: "<prefix><red>Kein Bau gefunden - stell dich in die Lobby oder gib den Bereich an."
no-permission: "<prefix><red>Dazu hast du keine Berechtigung."
players-only: "<prefix><red>Dieser Befehl kann nur von Spielern genutzt werden."
player-not-found: "<prefix><red>Spieler <white><player></white> wurde nicht gefunden."
reload-done: "<prefix><green>Konfiguration neu geladen."
send-done: "<prefix><green><count> Spieler zum Server geschickt."
status: "<prefix><gray>Hauptserver: <white><phase></white> <dark_gray>|</dark_gray> Wartende: <white><players></white> <hover:show_text:'<gray>Aus seit: <white><since><newline><gray>Port: <white><port><newline><gray>MRadmin: <white><link><newline><gray>Countdown bei Neustarts: <white><estimate>'><dark_gray>[Details]</dark_gray></hover>"
status-link-none: "nicht eingerichtet"
status-link-ok: "verbunden"
status-link-failed: "keine Antwort (<error>)"
status-port-open: "erreichbar"
status-port-closed: "nicht erreichbar"
phase-restart: "Neustart"
phase-stop: "heruntergefahren"
phase-crash: "nicht erreichbar"
phase-starting: "startet"
phase-maintenance: "Wartung"
phase-ready: "bereit"

# ------------------------------------------------------------- Version & Updates
version: "<prefix><gray>MRwaitroom <white>v<version></white> <dark_gray>(MC <mc>)</dark_gray> von <white><author></white>"
version-latest: "<prefix><green>Du nutzt die neueste Version."
version-outdated: "<prefix><gold>Neue Version verfügbar: <white><latest></white> <gray>(installiert: <current>) <download>"
version-unknown: "<prefix><gray>Update-Status unbekannt: <reason>"
version-checking: "<prefix><gray>Suche nach Updates …"
version-links: "<prefix><website> <dark_gray>| <github>"
update-download-label: "<aqua><u>[Download]</u></aqua>"
update-join-notify: "<prefix><gold>Ein Update für MRwaitroom ist verfügbar: <white><latest></white> <gray>(installiert: <current>) <download>"
update-reason-disabled: "die Update-Prüfung ist ausgeschaltet"
update-reason-not-found: "Projekt nicht gefunden (HTTP 404) - noch nicht veröffentlicht?"
update-reason-no-release: "keine veröffentlichte Version gefunden"
update-reason-no-repository: "kein GitHub-Repository eingestellt"
