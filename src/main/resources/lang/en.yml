# ==============================================================================
#   MRwaitroom - language file: English (en)
# ==============================================================================
#   Activate: in config.yml  general.language: en  (or auto)
#   Own language: copy this file (e.g. as fr.yml), translate it and set language: fr.
#   Missing texts are added automatically on updates - your changes are kept.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Empty text ("") = the message is not sent.
#   Placeholders of the display: <server> <reason> <since> <time> <estimate> <title> <end>
# ==============================================================================

# Do not change - tells the plugin which texts need to be renewed on updates.
lang-version: 8

prefix: "<dark_gray>[<aqua>Waiting room</aqua>]</dark_gray> "

# Plain texts (no formatting) - put into other texts.
reason-none: "no reason given"
server-name: "the server"
maintenance-no-title: "Maintenance"

# ---------------------------------------------------------------- Hotbar item
# Name of the clock - only changes when the situation changes (every change plays an animation in the game).
item-restart: "<yellow>⏳ Restart"
item-restart-late: "<yellow>⏳ Restart"
item-stop: "<red>■ Server is off"
item-crash: "<gold>↻ Server is restarting"
item-crash-late: "<gold>↻ Server is restarting"
item-starting: "<green>↻ Server is starting"
item-ready: "<green>➜ Back to the server"
item-returning: "<green>➜ Back to the server"
item-maintenance: "<aqua>🛠 Maintenance until <white><end>"
item-maintenance-open: "<aqua>🛠 Maintenance"
item-lore:
  - "<gray>You are waiting in the waiting room"
  - "<gray>and go back by yourself."
  - "<yellow>Right click: <gray>all details"

# ---------------------------------------------------------------------- Bossbar
# At the top of the screen, renewed every second. Always the same layout: state | countdown (reason and details in the clock menu).
bossbar-restart: "<yellow>Restart</yellow> <dark_gray>|</dark_gray> <white><time>"
bossbar-restart-late: "<yellow>Restart</yellow> <dark_gray>|</dark_gray> <white>back in a moment"
bossbar-stop: "<red>Server off</red> <dark_gray>|</dark_gray> <white>open end"
bossbar-crash: "<gold>Server restarting</gold> <dark_gray>|</dark_gray> <white><time>"
bossbar-crash-late: "<gold>Server restarting</gold> <dark_gray>|</dark_gray> <white>back in a moment"
bossbar-starting: "<green>Server starting</green> <dark_gray>|</dark_gray> <white>almost there"
bossbar-ready: "<green>Server ready</green> <dark_gray>|</dark_gray> <white><time>"
bossbar-returning: "<green>Server ready</green> <dark_gray>|</dark_gray> <white>going back"
bossbar-maintenance: "<aqua>Maintenance</aqua> <dark_gray>|</dark_gray> <white><time>"
bossbar-maintenance-open: "<aqua>Maintenance</aqua> <dark_gray>|</dark_gray> <white>open end"

# --------------------------------------------------------------------- Menu
# Opens with a right click on the clock.
menu-title: "Waiting room"
menu-reason-name: "<yellow>Reason"
menu-reason-lore:
  - "<white><reason>"
menu-time-name: "<aqua>Time"
menu-time-lore:
  - "<gray>Gone since: <white><since>"
  - "<gray>About left: <white><time>"
  - "<gray>Countdown of restarts: <white><estimate>"
menu-maintenance-name: "<aqua>Maintenance"
menu-maintenance-lore:
  - "<white><title>"
  - "<gray>Start: <white><start>"
  - "<gray>End: <white><end>"
menu-maintenance-planned:
  - "<gray>Planned: <white><title>"
  - "<gray>Start: <white><start>"
  - "<gray>End: <white><end>"
menu-maintenance-none:
  - "<gray>No maintenance planned."
menu-alerts-name: "<red>Warnings"
menu-alert-line: "<white>• <title>"
menu-alerts-none:
  - "<gray>None."
menu-back-name: "<green>Back to the server"
menu-back-lore:
  - "<gray>The server is ready."
menu-back-locked-name: "<gray>Not ready yet"
menu-back-locked-lore:
  - "<gray>You go back by yourself"
  - "<gray>as soon as it goes on."
menu-close: "<red>Close"

# -------------------------------------------------------------------- On joining
join-restart: "<prefix><yellow>Restart – you go back by yourself. <hover:show_text:'<gray>Reason: <white><reason><newline><gray>Countdown <white><estimate></white>, often faster'><dark_gray>[Info]</dark_gray></hover>"
join-stop: "<prefix><red>The server is shut down. <hover:show_text:'<gray>Reason: <white><reason><newline><gray>Off since <white><since><newline><gray>You go back as soon as it runs again.'><dark_gray>[Info]</dark_gray></hover>"
join-crash: "<prefix><gold>The server cannot be reached right now. <hover:show_text:'<gray>Since <white><since><newline><gray>You go back by yourself as soon as it runs again.'><dark_gray>[Info]</dark_gray></hover>"
join-starting: "<prefix><green>The server is starting – almost there."
join-ready: "<prefix><green>The server is ready – going back in a moment."
ready-countdown: "<prefix><green>The server is ready again – going back in <white><time></white> seconds."
back-item-name: "<green>Back to the server"
back-item-lore:
  - "<gray>Right click: back right away"
  - "<gray>(during a maintenance only with the right for it)"
admin-mode-item-on: "<gold>Admin mode: <green>on"
admin-mode-item-off: "<gold>Admin mode: <red>off"
admin-mode-item-on-lore:
  - "<gray>Creative, flying, invisible to waiting players"
  - "<gray>Right click: switch off"
admin-mode-item-off-lore:
  - "<gray>Right click: switch on"
  - "<gray>Counts on the main server too"
admin-mode-on: "<prefix><green>Admin mode on. <hover:show_text:'<gray>Creative mode, flying, invisible to waiting players<newline><gray>Counts on the main server too'><dark_gray>[Info]</dark_gray></hover>"
admin-mode-off: "<prefix><gray>Admin mode off. <hover:show_text:'<gray>Off on the main server too<newline><gray>You get your inventory back there'><dark_gray>[Info]</dark_gray></hover>"
admin-mode-denied: "<prefix><red>You may not use the admin mode here."
main-not-now: "<prefix><gray>The server does not take you right now. <hover:show_text:'<gray>Not ready yet - or a maintenance without the right for it'><dark_gray>[Info]</dark_gray></hover>"
join-maintenance: "<prefix><aqua>Maintenance until <white><end></white>. <hover:show_text:'<gray><white><title></white><newline><gray>About <white><time></white> left<newline><gray>Afterwards you go back by yourself.'><dark_gray>[Info]</dark_gray></hover>"
join-maintenance-open: "<prefix><aqua>Maintenance – no end set yet. <hover:show_text:'<gray><white><title></white><newline><gray>Afterwards you go back by yourself.'><dark_gray>[Info]</dark_gray></hover>"
alert: "<prefix><red>⚠ <white><title>"

# --------------------------------------------------------------------- Board
# The board of 4 × 2 maps (/mrwaitroom screen set). Five lines per state:
# heading, text, detail, countdown (big), label below it. Empty line = nothing.
screen-restart: ["RESTART", "The server is restarting.", "Reason: <reason>", "<time>", "remaining"]
screen-restart-late: ["RESTART", "Back in a moment.", "Reason: <reason>", "...", "starting soon"]
screen-stop: ["SERVER OFF", "The server was shut down.", "Reason: <reason>", "--:--", "open end"]
screen-crash: ["RESTART", "The server cannot be reached right now.", "Gone for <since>", "<time>", "remaining"]
screen-crash-late: ["RESTART", "The server cannot be reached right now.", "Gone for <since>", "...", "starting soon"]
screen-starting: ["STARTING", "The server is starting up.", "You go back in a moment.", "...", "starting soon"]
screen-ready: ["READY", "The server is back.", "You go back by yourself.", "<time>", "until you go back"]
screen-returning: ["READY", "Going back to the server ...", "", ">>", ""]
screen-maintenance: ["MAINTENANCE", "<title>", "Ends: <end>", "<time>", "remaining"]
screen-maintenance-open: ["MAINTENANCE", "<title>", "End not known yet", "--:--", "open end"]
# Footer left: maintenance; right: name of the server (from MRadmin).
screen-footer-maintenance: "Maintenance since <start>"
screen-footer-planned: "Next maintenance: <start>"
screen-footer-none: "No maintenance planned"
screen-footer-server: "<server>"

# -------------------------------------------------------------------- Going back
kick-refused: "<red>You cannot join the server right now.<newline><newline><gray>It turned you away several times (e.g. whitelist or ban)."
chat-off: "<prefix><gray>The chat is off in the waiting room."

# ---------------------------------------------------------------------- Commands
usage: "<prefix><gray>Commands: <aqua>/mrwaitroom status</aqua>, <aqua>send <player|all></aqua>, <aqua>screen</aqua>, <aqua>lobby</aqua>, <aqua>reload</aqua>, <aqua>version</aqua>"
screen-usage: "<prefix><gray>Board: <aqua>/mrwaitroom screen set</aqua> <hover:show_text:'<gray>Look at one frame of a wall of 4 × 2 frames.'><dark_gray>[?]</dark_gray></hover> <gray>or <aqua>remove"
screen-set-done: "<prefix><green>The board is up. <hover:show_text:'<gray>The frames are locked.<newline><gray>Take it down: <white>/mrwaitroom screen remove'><dark_gray>[Info]</dark_gray></hover>"
screen-no-frame: "<prefix><red>Look at one frame of the wall."
screen-not-on-wall: "<prefix><red>The frames must hang on a wall."
screen-wrong-size: "<prefix><red>The wall is <white><width> × <height></white> frames. <hover:show_text:'<gray>It needs exactly 4 wide and 2 high,<newline><gray>all frames facing the same way.'><dark_gray>[Info]</dark_gray></hover>"
screen-removed: "<prefix><green>The board is taken down."
screen-none: "<prefix><gray>There is no board."
lobby-usage: "<prefix><gray>Save the lobby: <aqua>/mrwaitroom lobby save</aqua> <hover:show_text:'<gray>Without an area MRwaitroom finds the build by itself.<newline><gray>With an area: <white>save x1 y1 z1 x2 y2 z2'><dark_gray>[?]</dark_gray></hover>"
lobby-saving: "<prefix><gray>Saving the lobby ..."
lobby-saved: "<prefix><green>Lobby saved <white>(<size>)</white>. <hover:show_text:'<gray>From <white><from></white> to <white><to><newline><gray>New waiting room worlds start with this lobby,<newline><gray>spawn and board included.<newline><gray>Folder: plugins/MRwaitroom/lobby'><dark_gray>[Info]</dark_gray></hover>"
lobby-empty: "<prefix><red>No build found - stand in the lobby or give the area."
no-permission: "<prefix><red>You do not have permission to do that."
players-only: "<prefix><red>Only players can use this command."
player-not-found: "<prefix><red>Player <white><player></white> was not found."
reload-done: "<prefix><green>Configuration reloaded."
send-done: "<prefix><green>Sent <count> players to the server."
status: "<prefix><gray>Main server: <white><phase></white> <dark_gray>|</dark_gray> Waiting: <white><players></white> <hover:show_text:'<gray>Down since: <white><since><newline><gray>Port: <white><port><newline><gray>MRadmin: <white><link><newline><gray>Countdown of restarts: <white><estimate>'><dark_gray>[Details]</dark_gray></hover>"
status-link-none: "not set up"
status-link-ok: "connected"
status-link-failed: "no answer (<error>)"
status-port-open: "reachable"
status-port-closed: "not reachable"
phase-restart: "restart"
phase-stop: "shut down"
phase-crash: "not reachable"
phase-starting: "starting"
phase-maintenance: "maintenance"
phase-ready: "ready"

# --------------------------------------------------------------- Version & updates
version: "<prefix><gray>MRwaitroom <white>v<version></white> <dark_gray>(MC <mc>)</dark_gray> by <white><author></white>"
version-latest: "<prefix><green>You are running the latest version."
version-outdated: "<prefix><gold>New version available: <white><latest></white> <gray>(installed: <current>) <download>"
version-unknown: "<prefix><gray>Update status unknown: <reason>"
version-checking: "<prefix><gray>Checking for updates ..."
version-links: "<prefix><website> <dark_gray>| <github>"
update-download-label: "<aqua><u>[Download]</u></aqua>"
update-join-notify: "<prefix><gold>An update for MRwaitroom is available: <white><latest></white> <gray>(installed: <current>) <download>"
update-reason-disabled: "the update check is disabled"
update-reason-not-found: "project not found (HTTP 404) - not published yet?"
update-reason-no-release: "no published version found"
update-reason-no-repository: "no GitHub repository configured"
